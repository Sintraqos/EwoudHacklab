<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to the css file -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Link to a navigation bar icon -->
    <link rel="icon" href="/images/logo/Logo_Black.png" type="image/png">
</head>
<body>

<!-- Display the header of the page -->
<div th:replace="~{fragments::header}"></div>

<!-- Display a message if exists -->
<div th:replace="~{fragments :: messages}"></div>

<!-- Content of the page-->
<div class="buttons-container">
    <form th:action="@{/register}" method="post">
        <!-- Create Input fields -->
        <div class="form-group"><label> Username : </label> <input type="text" name="username"/></div>
        <div class="form-group"><label> E-Mail Address: </label> <input type="eMail" name="eMail"/></div>
        <div class="form-group"><label> Password: </label> <input type="password" name="password"/></div>
        <div class="form-group"><label> Confirm Password: </label> <input type="password" name="passwordConfirm"/></div>
        <!-- Create Buttons -->
        <div class="submit-container"><button class="base" type="submit" name="action" value="Register">Register</button></div>
    </form>

    <!-- Return to Home -->
    <div class="form-group">
        <a href="/home">
            <button class="base" type="button">Return</button>
        </a>
    </div>
  </div>

<!-- Display the footer of the page -->
<div th:replace="~{fragments::footer}"></div>

</body>
</html>
