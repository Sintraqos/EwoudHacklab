<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to the css file -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Link to a navigation bar icon -->
    <link rel="icon" href="/images/logo/Logo_Black.png" type="image/png">
</head>
<body>

<!-- Display the header of the page -->
<div th:replace="~{fragments::header}"></div>

<!-- Display a message if exists -->
<div th:replace="~{fragments :: messages}"></div>

<!-- Content of the page-->
<div class="buttons-container">
    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
      <!-- Create Input fields -->
      <div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/></div>
      <div class="form-group">
          <label> Username:</label>
          <input class="form-group" type="text" name="username"/>
      </div>
      <div class="form-group">
          <label> Password: </label>
          <input class="form-group" type="password" name="password"/>
      </div>
        <!-- Create Login Button -->
        <div class="submit-container"><button class="base" type="submit" name="action" value="Login">Login</button></div>
    </form>

    <!-- Return to Home -->
    <div class="form-group">
      <a href="/home">
        <button class="base" type="button">Return</button>
      </a>
    </div>
</div>

<!-- Display the footer of the page -->
<div th:replace="~{fragments::footer}"></div>

</body>
</html>
